<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<link rel="stylesheet" href="style.css">

<script src="pokemon_data.js"></script>
<script src="evolution.js"></script>
</head>

<body>

<div class="container">

<!-- MENU -->
<div id="menu" class="panel">
  <h1>Wer bin ich?</h1>

  <input id="seedInput" placeholder="Seed"><br>
  <input id="playerInput" placeholder="Name"><br>

  <div class="section-title">Generationen</div>
  <div class="genbox">
    <label><input type="checkbox" value="1" checked><span>Gen 1</span></label>
    <label><input type="checkbox" value="2" checked><span>Gen 2</span></label>
    <label><input type="checkbox" value="3" checked><span>Gen 3</span></label>
    <label><input type="checkbox" value="4" checked><span>Gen 4</span></label>
    <label><input type="checkbox" value="5" checked><span>Gen 5</span></label>
    <label><input type="checkbox" value="6" checked><span>Gen 6</span></label>
    <label><input type="checkbox" value="7" checked><span>Gen 7</span></label>
    <label><input type="checkbox" value="8" checked><span>Gen 8</span></label>
    <label><input type="checkbox" value="9" checked><span>Gen 9</span></label>
  </div>

  <div class="section-title">Größe</div>
  <div class="genbox">
    <label><input type="radio" name="size" value="12"><span>12</span></label>
    <label><input type="radio" name="size" value="24" checked><span>24</span></label>
    <label><input type="radio" name="size" value="36"><span>36</span></label>
    <label><input type="radio" name="size" value="48"><span>48</span></label>
  </div>

  <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="game" class="panel" style="display:none;">
  <button onclick="back()">⬅ Menü</button>

  <h2 id="target"></h2>
  <div id="board" class="grid"></div>
</div>

</div>

<!-- INTRO -->
<div id="intro"><span id="introText"></span></div>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <img id="popImg">
    <h3 id="popName"></h3>
    <div id="popTypes"></div>
    <div id="popEvo"></div>
    <button onclick="closePopup()">Schließen</button>
  </div>
</div>

<script>

/* TYPE MAP */
const TYPE_MAP = {
  Fire:"Feuer", Water:"Wasser", Grass:"Pflanze", Electric:"Elektro",
  Ice:"Eis", Fighting:"Kampf", Poison:"Gift", Ground:"Boden",
  Flying:"Flug", Psychic:"Psycho", Bug:"Käfer", Rock:"Gestein",
  Ghost:"Geist", Dragon:"Drache", Dark:"Unlicht",
  Steel:"Stahl", Fairy:"Fee", Normal:"Normal"
};

/* RNG */
let seedValue=0;
function hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=Math.imul(31,h)+str.charCodeAt(i)|0;} return h;}
function rand(){ seedValue+=0x6D2B79F5; let t=seedValue; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296;}

/* INTRO */
async function playIntro(target,pool){
  intro.classList.add("show");

  for(let i=0;i<20;i++){
    let p=pool[Math.floor(Math.random()*pool.length)];
    introText.innerText=p.name_de;
    await new Promise(r=>setTimeout(r,40));
  }

  introText.innerText=target.name_de;
  await new Promise(r=>setTimeout(r,500));

  intro.classList.remove("show");
}

/* POPUP */
function showPopup(p){
  popup.style.display="flex";
  popImg.src=p.img;
  popName.innerText=p.name_de;
  popTypes.innerText=(p.types||[]).map(t=>TYPE_MAP[t]||t).join(", ");
  popEvo.innerText=getEvolutionChain(p).map(e=>e.name_de).join(" → ");
}
function closePopup(){ popup.style.display="none"; }

/* START */
async function startGame(){

  if(typeof applyEvolutionData==="function"){
    applyEvolutionData();
  }

  seedValue=hash(seedInput.value||"random");

  let gens=[...document.querySelectorAll(".genbox input:checked")].map(e=>+e.value);
  let size=+document.querySelector('input[name="size"]:checked').value;

  let pool=POKEMON.filter(p=>gens.includes(p.gen));

  /* SHUFFLE */
  for(let i=pool.length-1;i>0;i--){
    let j=Math.floor(rand()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  let data=pool.slice(0,size);
  let target=data[Math.abs(hash(seedInput.value+playerInput.value))%data.length];

  menu.style.display="none";

  await playIntro(target,pool);

  game.style.display="block";
  target.innerText="Du bist: "+target.name_de;

  board.innerHTML="";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.img}">
      <div>${p.name_de}</div>
      <div class="types">
        ${(p.types||[]).map(t=>{
          let de = TYPE_MAP[t] || t;
          return `<span class="type ${de}">${de}</span>`;
        }).join("")}
      </div>
    `;

    /* ⚡ SNAPPY CLICK */
    let lastTap=0;

    card.onclick=()=>{
      let now=Date.now();

      if(now-lastTap<250){
        showPopup(p);
      } else {
        card.classList.toggle("off");
      }

      lastTap=now;
    };

    board.appendChild(card);
  });
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

</script>

</body>
</html>
