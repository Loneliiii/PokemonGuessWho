<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<link rel="stylesheet" href="style.css">
<script src="pokemon_data.js"></script>

<style>
.container { width:100%; max-width:900px; }

.panel {
  background:rgba(22,27,34,0.9);
  backdrop-filter: blur(10px);
  padding:20px;
  border-radius:16px;
  text-align:center;
}

.title {
  font-size:28px;
  margin-bottom:10px;
  background:linear-gradient(90deg,#58a6ff,#9b59ff);
  -webkit-background-clip:text;
  -webkit-text-fill-color:transparent;
}

input, select {
  width:90%;
  max-width:320px;
  padding:10px;
  margin:8px;
  border-radius:10px;
  border:none;
  background:#0d1117;
  color:white;
}

.genbox {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:6px;
}

.genbox label {
  background:#21262d;
  padding:6px 10px;
  border-radius:8px;
  cursor:pointer;
}

.genbox input { display:none; }

.genbox input:checked + span {
  background:#58a6ff;
  color:black;
}

/* GRID */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(80px,1fr));
  gap:10px;
}

.card {
  background:#21262d;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
  transform:scale(0);
  opacity:0;
  transition:0.3s;
}

.card.show { transform:scale(1); opacity:1; }

.card img { width:64px; }

.card.off { opacity:0.3; transform:scale(0.9); }

.types {
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:3px;
}

.type {
  font-size:10px;
  padding:2px 6px;
  border-radius:6px;
  color:white;
}

/* COLORS */
.normal{background:#A8A77A;}
.fire{background:#EE8130;}
.water{background:#6390F0;}
.grass{background:#7AC74C;}
.electric{background:#F7D02C;color:black;}
.ice{background:#96D9D6;}
.fighting{background:#C22E28;}
.poison{background:#A33EA1;}
.ground{background:#E2BF65;color:black;}
.flying{background:#A98FF3;}
.psychic{background:#F95587;}
.bug{background:#A6B91A;}
.rock{background:#B6A136;}
.ghost{background:#735797;}
.dragon{background:#6F35FC;}
.dark{background:#705848;}
.steel{background:#B7B7CE;color:black;}
.fairy{background:#D685AD;}

.target {
  background:#238636;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

/* INTRO */
#intro {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:#0d1117;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:36px;
  opacity:0;
  pointer-events:none;
}

#intro.show { opacity:1; transition:0.4s; }
</style>
</head>

<body>

<div class="container">

<div id="menu" class="panel">
  <div class="title">Wer bin ich?</div>

  <input id="seedInput" placeholder="Seed / Code"><br>

  <!-- 👉 Spieler-ID (wichtig!) -->
  <input id="playerInput" placeholder="Dein Name / ID"><br>

  <select id="lang">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
  </select>

  <div class="genbox">
    <label><input type="checkbox" value="1" checked><span>Gen 1</span></label>
    <label><input type="checkbox" value="2" checked><span>Gen 2</span></label>
    <label><input type="checkbox" value="3" checked><span>Gen 3</span></label>
    <label><input type="checkbox" value="4" checked><span>Gen 4</span></label>
    <label><input type="checkbox" value="5" checked><span>Gen 5</span></label>
    <label><input type="checkbox" value="6" checked><span>Gen 6</span></label>
    <label><input type="checkbox" value="7" checked><span>Gen 7</span></label>
    <label><input type="checkbox" value="8" checked><span>Gen 8</span></label>
    <label><input type="checkbox" value="9" checked><span>Gen 9</span></label>
  </div>

  <button onclick="startGame()">Start</button>
</div>

<div id="game" class="panel" style="display:none;">
  <button onclick="back()">⬅ Neue Runde</button>
  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<div id="intro"><span id="introText"></span></div>

<script>
let seedValue=0;

const TYPE_NAMES = {
  normal:{de:"Normal",en:"Normal"},
  fire:{de:"Feuer",en:"Fire"},
  water:{de:"Wasser",en:"Water"},
  grass:{de:"Pflanze",en:"Grass"},
  electric:{de:"Elektro",en:"Electric"},
  ice:{de:"Eis",en:"Ice"},
  fighting:{de:"Kampf",en:"Fighting"},
  poison:{de:"Gift",en:"Poison"},
  ground:{de:"Boden",en:"Ground"},
  flying:{de:"Flug",en:"Flying"},
  psychic:{de:"Psycho",en:"Psychic"},
  bug:{de:"Käfer",en:"Bug"},
  rock:{de:"Gestein",en:"Rock"},
  ghost:{de:"Geist",en:"Ghost"},
  dragon:{de:"Drache",en:"Dragon"},
  dark:{de:"Unlicht",en:"Dark"},
  steel:{de:"Stahl",en:"Steel"},
  fairy:{de:"Fee",en:"Fairy"}
};

function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h=Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

function getGens(){
  return Array.from(document.querySelectorAll(".genbox input:checked"))
    .map(e=>parseInt(e.value));
}

async function startGame(){

  let lang=document.getElementById("lang").value;
  let seed=document.getElementById("seedInput").value;
  let playerId=document.getElementById("playerInput").value || "player";

  seedValue=hash(seed||"random");

  let gens=getGens();
  let pool=POKEMON.filter(p=>gens.includes(p.gen));

  /* 🔥 FIXED SHUFFLE */
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  let data=pool.slice(0,24);

  /* 🔥 DIFFERENT TARGET PER PLAYER */
  let targetIndex=Math.abs(hash(seed + playerId)) % data.length;
  let target=data[targetIndex];

  let name = lang==="de" ? target.name_de : target.name_en;

  menu.style.display="none";

  introText.innerText=name;
  intro.classList.add("show");

  await new Promise(r=>setTimeout(r,1200));

  intro.classList.remove("show");

  game.style.display="block";

  let board=document.getElementById("board");
  let targetDiv=document.getElementById("target");

  board.innerHTML="";

  data.forEach((p,i)=>{
    let pname = lang==="de" ? p.name_de : p.name_en;

    let typesHTML=(p.types||[]).map(t=>{
      let label=TYPE_NAMES[t]?.[lang] || t;
      return `<span class="type ${t}">${label}</span>`;
    }).join("");

    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.img}">
      <div>${pname}</div>
      <div class="types">${typesHTML}</div>
    `;

    card.onclick=()=>card.classList.toggle("off");

    board.appendChild(card);

    setTimeout(()=>card.classList.add("show"), i*30);
  });

  targetDiv.innerText =
    (lang==="de"?"Du bist: ":"You are: ")
    + name;
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}
</script>

</body>
</html>
