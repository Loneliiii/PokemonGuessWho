<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<link rel="stylesheet" href="style.css">

<script src="pokemon_data.js"></script>
<script src="evolution.js"></script>
</head>

<body>

<div class="container">

<div id="menu" class="panel">
  <div class="title">Wer bin ich?</div>

  <div class="desc">
    Tippe zum Ausblenden – doppelt tippen für Infos.
  </div>

  <input id="seedInput" placeholder="Seed"><br>
  <input id="playerInput" placeholder="Dein Name"><br>

  <select id="lang">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
  </select>

  <div class="section-title">Generationen</div>
  <div class="genbox">
    <label><input type="checkbox" value="1" checked><span>Gen 1</span></label>
    <label><input type="checkbox" value="2" checked><span>Gen 2</span></label>
    <label><input type="checkbox" value="3" checked><span>Gen 3</span></label>
    <label><input type="checkbox" value="4" checked><span>Gen 4</span></label>
    <label><input type="checkbox" value="5" checked><span>Gen 5</span></label>
    <label><input type="checkbox" value="6" checked><span>Gen 6</span></label>
    <label><input type="checkbox" value="7" checked><span>Gen 7</span></label>
    <label><input type="checkbox" value="8" checked><span>Gen 8</span></label>
    <label><input type="checkbox" value="9" checked><span>Gen 9</span></label>
  </div>

  <div class="section-title">Anzahl Pokémon</div>
  <div class="genbox">
    <label><input type="radio" name="size" value="12"><span>12</span></label>
    <label><input type="radio" name="size" value="24" checked><span>24</span></label>
    <label><input type="radio" name="size" value="36"><span>36</span></label>
    <label><input type="radio" name="size" value="48"><span>48</span></label>
  </div>

  <button onclick="startGame()">Start</button>
</div>

<div id="game" class="panel" style="display:none;">
  <div class="panel-top">
    <button onclick="back()">⬅ Neue Runde</button>

    <div class="zoom-group">
      <button onclick="zoomIn()">➕</button>
      <button onclick="zoomOut()">➖</button>
    </div>
  </div>

  <div id="activeRule" class="active-rule"></div>
  <div id="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<div id="intro"><span id="introText"></span></div>

<div id="rulesScreen">
  <div class="rules-box">
    <h2>⚠️ Sonderregel</h2>
    <div id="rulesList"></div>
  </div>
</div>

<div id="popup" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <img id="popImg">
    <h3 id="popName"></h3>
    <div id="popDex"></div>
    <div id="popTypes"></div>
    <div id="popEvo"></div>
    <button onclick="closePopup()">Schließen</button>
  </div>
</div>

<script>

let seedValue=0;
let currentRule="";

/* ZOOM */
let tileSize = 90;
function applyZoom(){
  document.documentElement.style.setProperty("--tile-size", tileSize + "px");
}
function zoomIn(){ tileSize=Math.min(tileSize+20,220); applyZoom(); }
function zoomOut(){ tileSize=Math.max(tileSize-20,60); applyZoom(); }

/* RULES */
const RULES = [
  "Keine Fragen zu Entwicklungen",
  "Keine Fragen zu Typen",
  "Keine Fragen zur Farbe",
  "Keine Fragen zur Generation"
];

function getRandomRule(){
  return RULES[Math.floor(rand()*RULES.length)];
}

async function showRulesScreen(rule){
  rulesList.innerHTML=`❌ ${rule}`;
  rulesScreen.classList.add("show");
  await new Promise(r=>setTimeout(r,2000));
  rulesScreen.classList.remove("show");
}

/* RNG */
function hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=Math.imul(31,h)+str.charCodeAt(i)|0;} return h;}
function rand(){ seedValue+=0x6D2B79F5; let t=seedValue; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296;}
function getGens(){ return Array.from(document.querySelectorAll(".genbox input:checked")).map(e=>parseInt(e.value));}
function getSize(){ return parseInt(document.querySelector('input[name="size"]:checked').value);}

/* 🔥 TYPE FIX */
const TYPE_MAP = {
  Normal:"Normal",
  Fire:"Feuer",
  Water:"Wasser",
  Grass:"Pflanze",
  Electric:"Elektro",
  Ice:"Eis",
  Fighting:"Kampf",
  Poison:"Gift",
  Ground:"Boden",
  Flying:"Flug",
  Psychic:"Psycho",
  Bug:"Käfer",
  Rock:"Gestein",
  Ghost:"Geist",
  Dragon:"Drache",
  Dark:"Unlicht",
  Steel:"Stahl",
  Fairy:"Fee"
};

/* POPUP */
function showPopup(p){
  popup.style.display="flex";
  popImg.src=p.img;
  popName.innerText=p.name_de;
  popDex.innerText="Dex #"+p.id;
  popTypes.innerText=(p.types||[]).map(t=>TYPE_MAP[t]||t).join(", ");
  popEvo.innerText=getEvolutionChain(p).map(e=>e.name_de).join(" → ");
}
function closePopup(){ popup.style.display="none"; }

/* START */
async function startGame(){

  if(typeof applyEvolutionData==="function"){
    applyEvolutionData();
  }

  applyZoom();

  let seed=seedInput.value;
  let playerId=playerInput.value||"player";

  seedValue=hash(seed||"random");

  let pool=POKEMON.filter(p=>getGens().includes(p.gen));

  for(let i=pool.length-1;i>0;i--){
    let j=Math.floor(rand()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  let data=pool.slice(0,getSize());

  let targetPokemon=data[Math.abs(hash(seed+playerId))%data.length];

  menu.style.display="none";

  let rule=getRandomRule();
  currentRule=rule;
  await showRulesScreen(rule);

  game.style.display="block";
  activeRule.innerText="⚠️ "+currentRule;

  board.innerHTML="";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.img}">
      <div>${p.name_de}</div>
      <div class="types">
        ${(p.types||[]).map(t=>{
          let de = TYPE_MAP[t] || t;
          return `<span class="type ${de}">${de}</span>`;
        }).join("")}
      </div>
    `;

    let lastTap=0;

    card.onclick=()=>{
      let now=Date.now();
      if(now-lastTap<300){
        showPopup(p);
      } else {
        setTimeout(()=>{
          if(Date.now()-lastTap>=300){
            card.classList.toggle("off");
          }
        },300);
      }
      lastTap=now;
    };

    board.appendChild(card);
  });

  target.innerText="Du bist: "+targetPokemon.name_de;
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

</script>

</body>
</html>
