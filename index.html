<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#111;
}

.pokedex {
  background:#c0392b;
  min-height:100vh;
  padding:15px;
}

.screen {
  background:#ecf0f1;
  border-radius:15px;
  padding:15px;
  max-width:900px;
  margin:auto;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(90px,1fr));
  gap:8px;
}

.card {
  background:white;
  border-radius:10px;
  padding:5px;
  text-align:center;
  cursor:pointer;
}

.card img { width:72px; }

.card.off { opacity:0.3; }

/* TYPES */
.types {
  margin-top:3px;
  font-size:10px;
  display:flex;
  justify-content:center;
  gap:3px;
  flex-wrap:wrap;
}

.type {
  padding:2px 5px;
  border-radius:5px;
  color:white;
  font-size:10px;
}

/* COLORS */
.fire{background:#EE8130;}
.water{background:#6390F0;}
.grass{background:#7AC74C;}
.electric{background:#F7D02C;color:black;}
.ice{background:#96D9D6;}
.fighting{background:#C22E28;}
.poison{background:#A33EA1;}
.ground{background:#E2BF65;color:black;}
.flying{background:#A98FF3;}
.psychic{background:#F95587;}
.bug{background:#A6B91A;}
.rock{background:#B6A136;}
.ghost{background:#735797;}
.dragon{background:#6F35FC;}
.dark{background:#705848;}
.steel{background:#B7B7CE;color:black;}
.fairy{background:#D685AD;}

.target {
  background:#2ecc71;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

button, input, select {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<div class="pokedex">

<!-- MENU -->
<div id="menu" class="screen">
  <h2 id="title">Wer bin ich? 🔍</h2>

  <input id="playerName" placeholder="Name"><br>
  <input id="seedInput" placeholder="Seed / Code"><br>

  <select id="lang" onchange="updateLang()">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
  </select><br>

  <button onclick="startGame()" id="startBtn">Start</button>
</div>

<!-- GAME -->
<div id="game" class="screen" style="display:none;">
  <button onclick="back()">⬅</button>
  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<script>
let seedValue = 0;
let currentLang = "de";

/* TYPE TRANSLATION */
const typesDE = {
  fire:"Feuer", water:"Wasser", grass:"Pflanze", electric:"Elektro",
  ice:"Eis", fighting:"Kampf", poison:"Gift", ground:"Boden",
  flying:"Flug", psychic:"Psycho", bug:"Käfer", rock:"Gestein",
  ghost:"Geist", dragon:"Drache", dark:"Unlicht", steel:"Stahl",
  fairy:"Fee", normal:"Normal"
};

/* LANGUAGE */
function updateLang(){
  currentLang = document.getElementById("lang").value;

  if(currentLang==="de"){
    title.innerText="Wer bin ich? 🔍";
    startBtn.innerText="Start";
    playerName.placeholder="Name";
  } else {
    title.innerText="Who am I? 🔍";
    startBtn.innerText="Start";
    playerName.placeholder="Your name";
  }
}

/* RNG */
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(rand()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

/* START */
async function startGame(){

  const player = playerName.value.trim();
  const seedInput = document.getElementById("seedInput").value.trim();

  if(!player){
    alert(currentLang==="de"?"Name fehlt":"Enter name");
    return;
  }

  seedValue = hash(seedInput || "random");

  menu.style.display="none";
  game.style.display="block";

  let ids=[];
  for(let i=1;i<=151;i++) ids.push(i);

  shuffle(ids);
  ids = ids.slice(0,24);

  board.innerHTML="Loading...";

  let data=[];

  for(let id of ids){
    let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    let p = await res.json();
    data.push(p);
  }

  board.innerHTML="";

  data.forEach(p=>{

    let typesHTML = p.types.map(t=>{
      let name = currentLang==="de"
        ? typesDE[t.type.name]
        : t.type.name;

      return `<span class="type ${t.type.name}">${name}</span>`;
    }).join("");

    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.sprites.front_default}">
      <div>${p.name}</div>
      <div class="types">${typesHTML}</div>
    `;

    card.onclick=()=>card.classList.toggle("off");

    board.appendChild(card);
  });

  let playerSeed = hash(seedInput + player);
  let targetIndex = Math.abs(playerSeed) % data.length;
  let target = data[targetIndex];

  document.getElementById("target").innerHTML =
    (currentLang==="de"?"Du bist: ":"You are: ")
    + "<b>"+target.name+"</b>";
}
</script>

</body>
</html>
