<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich? – Deluxe</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#2c3e50;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container {
  width:95%;
  max-width:900px;
}

.panel {
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
}

.card {
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.card.off { opacity:0.3; }

button, input, select {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button {
  background:#3498db;
  color:white;
  cursor:pointer;
}

button:hover { background:#2980b9; }

.topbar {
  display:flex;
  justify-content:space-between;
}

.target {
  background:#f1c40f;
  color:black;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
}
</style>
</head>

<body>

<div class="container">

<div id="menu" class="panel">
  <h1 id="title">Wer bin ich? 🔍</h1>

  <input id="name" placeholder="Dein Name"><br>
  <input id="seed" placeholder="Geheimwort / Code"><br>

  <select id="count">
    <option value="16">16 Pokémon</option>
    <option value="24" selected>24 Pokémon</option>
    <option value="36">36 Pokémon</option>
  </select><br>

  <select id="lang" onchange="updateLang()">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
  </select><br>

  <button onclick="startGame()" id="startBtn">🚀 Start</button>
  <button onclick="randomGame()">🎲 Zufall</button>
  <button onclick="copyCode()">🔗 Code</button>
</div>

<div id="game" style="display:none;">
  <div class="topbar">
    <button onclick="back()">⬅</button>
    <button onclick="copyCode()">🔗</button>
  </div>

  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<script>
let seedValue = 0;
let currentLang = "de";

// Sprache
function updateLang(){
  currentLang = document.getElementById("lang").value;

  if(currentLang==="de"){
    title.innerText="Wer bin ich? 🔍";
    startBtn.innerText="🚀 Spiel starten";
  } else {
    title.innerText="Who am I? 🔍";
    startBtn.innerText="🚀 Start Game";
  }
}

// Hash
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

// RNG
function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

// Invite
function encode(seed,count){
  return "PKMN-"+btoa(seed+"|"+count);
}

function decode(code){
  try{
    let txt=atob(code.replace("PKMN-",""));
    let [s,c]=txt.split("|");
    return {s,c};
  }catch{return null;}
}

function copyCode(){
  let seed=document.getElementById("seed").value||"random";
  let count=document.getElementById("count").value;
  navigator.clipboard.writeText(encode(seed,count));
  alert("Copied!");
}

function randomGame(){
  let s=Math.random().toString(36).substring(2,6).toUpperCase();
  document.getElementById("seed").value=s;
  startGame();
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

// 🔥 DEUTSCHE NAMEN über API
async function getGermanName(id){
  let res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
  let data = await res.json();
  let de = data.names.find(n=>n.language.name==="de");
  return de ? de.name : data.name;
}

// Start
async function startGame(){

  let player=name.value.trim();
  if(!player){
    alert(currentLang==="de"?"Name fehlt":"Enter name");
    return;
  }

  let seedInput=seed.value.trim();
  let count=parseInt(document.getElementById("count").value);

  if(seedInput.startsWith("PKMN-")){
    let d=decode(seedInput);
    if(d){
      seedInput=d.s;
      count=d.c;
    }
  }

  if(!seedInput) seedInput="random"+Math.random();

  seedValue=hash(seedInput);

  menu.style.display="none";
  game.style.display="block";

  let ids=[];
  for(let i=1;i<=151;i++) ids.push(i);

  ids.sort(()=>rand()-0.5);
  ids=ids.slice(0,count);

  board.innerHTML="Loading...";

  let data=[];

  for(let id of ids){
    let res=await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    let p=await res.json();

    let nameFinal = currentLang==="de"
      ? await getGermanName(id)
      : p.name;

    data.push({...p, displayName:nameFinal});
  }

  board.innerHTML="";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.sprites.front_default}">
      <div>${p.displayName}</div>
    `;

    card.onclick=()=>card.classList.toggle("off");
    board.appendChild(card);
  });

  let playerSeed = hash(seedInput + player);
  let targetIndex = Math.abs(playerSeed) % data.length;
  let target = data[targetIndex];

  targetDiv.innerHTML =
    (currentLang==="de"?"Du bist: ":"You are: ")
    + "<b>"+target.displayName+"</b>";
}
</script>

</body>
</html>
