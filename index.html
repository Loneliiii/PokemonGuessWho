<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich? – Pokédex</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#111;
}

.pokedex {
  background:#c0392b;
  min-height:100vh;
  padding:15px;
}

.screen {
  background:#ecf0f1;
  border-radius:15px;
  padding:15px;
  max-width:900px;
  margin:auto;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(90px,1fr));
  gap:8px;
}

.card {
  background:white;
  border-radius:10px;
  padding:5px;
  text-align:center;
  cursor:pointer;
  position:relative;
}

.card img { width:72px; }

.card.off { opacity:0.3; }

/* 🔥 HIGHLIGHT */
.card.show-info {
  outline:3px solid #3498db;
}

/* 🔥 TYPES OVERLAY */
.types {
  position:absolute;
  bottom:5px;
  left:50%;
  transform:translateX(-50%);
  display:none;
  gap:3px;
}

.card.show-info .types {
  display:flex;
}

.type {
  padding:2px 5px;
  border-radius:5px;
  font-size:10px;
  color:white;
}

/* TYPE COLORS */
.fire { background:#e67e22; }
.water { background:#3498db; }
.grass { background:#2ecc71; }
.electric { background:#f1c40f; color:black; }
.ice { background:#5dade2; }
.fighting { background:#c0392b; }
.poison { background:#8e44ad; }
.ground { background:#d4ac0d; }
.flying { background:#85c1e9; }
.psychic { background:#ff6b81; }
.bug { background:#82e0aa; color:black; }
.rock { background:#a04000; }
.ghost { background:#5b2c6f; }
.dragon { background:#6c3483; }
.dark { background:#34495e; }
.steel { background:#95a5a6; }
.fairy { background:#f8cdda; color:black; }

.target {
  background:#2ecc71;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

button, input {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<div class="pokedex">

<div id="menu" class="screen">
  <h2>Wer bin ich? 🔍</h2>
  <input id="playerName" placeholder="Name"><br>
  <input id="seedInput" placeholder="Seed"><br>
  <button onclick="startGame()">Start</button>
</div>

<div id="game" class="screen" style="display:none;">
  <button onclick="back()">⬅</button>
  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<script>
let seedValue = 0;

function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(rand()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

async function startGame(){

  const player = playerName.value.trim();
  const seedInput = document.getElementById("seedInput").value.trim();

  if(!player){
    alert("Name fehlt");
    return;
  }

  seedValue = hash(seedInput || "random");

  menu.style.display="none";
  game.style.display="block";

  let ids=[];
  for(let i=1;i<=151;i++) ids.push(i);

  shuffle(ids);
  ids = ids.slice(0,24);

  board.innerHTML="Loading...";

  let data=[];

  for(let id of ids){
    let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    let p = await res.json();
    data.push(p);
  }

  board.innerHTML="";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    let typesHTML = p.types.map(t =>
      `<span class="type ${t.type.name}">${t.type.name}</span>`
    ).join("");

    card.innerHTML=`
      <img src="${p.sprites.front_default}">
      <div>${p.name}</div>
      <div class="types">${typesHTML}</div>
    `;

    // Klick = eliminieren
    card.onclick=()=>card.classList.toggle("off");

    // 🖱️ Hover (PC)
    card.onmouseenter=()=>card.classList.add("show-info");
    card.onmouseleave=()=>card.classList.remove("show-info");

    // 📱 Long Press (Mobile)
    let pressTimer;
    card.ontouchstart=()=>{
      pressTimer = setTimeout(()=>{
        card.classList.add("show-info");
      },300);
    };

    card.ontouchend=()=>{
      clearTimeout(pressTimer);
      setTimeout(()=>card.classList.remove("show-info"),200);
    };

    board.appendChild(card);
  });

  let playerSeed = hash(seedInput + player);
  let targetIndex = Math.abs(playerSeed) % data.length;
  let target = data[targetIndex];

  document.getElementById("target").innerHTML =
    "Du bist: <b>"+target.name+"</b>";
}
</script>

</body>
</html>
