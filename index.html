<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pokémon - Wer bin ich?</title>
    
    <script src="pokemon_de.js"></script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50; color: #333; margin: 0; padding: 2vmin; height: 100vh; width: 100vw;
            box-sizing: border-box; display: flex; justify-content: center; overflow: hidden; 
        }
        
        .pokedex {
            background-color: #dc0a2d; width: 100%; max-width: 1600px; height: 100%; border-radius: 15px; padding: 15px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 5px 10px 20px rgba(0,0,0,0.5); border: 4px solid #8b0000; box-sizing: border-box; display: flex; flex-direction: column;
            overflow: hidden;
        }

        .lights { display: flex; align-items: flex-start; gap: 15px; margin-bottom: 10px; flex-shrink: 0; }
        .light-main { width: 40px; height: 40px; background-color: #28aafa; border-radius: 50%; border: 3px solid #fff; box-shadow: 0 0 10px #28aafa, inset -5px -5px 10px rgba(0,0,0,0.3); }
        .light-small { width: 12px; height: 12px; border-radius: 50%; border: 2px solid #333; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3); }
        .light-red { background-color: #ff2c2c; } .light-yellow { background-color: #fdfd28; } .light-green { background-color: #28fd28; }

        .screen-container {
            background-color: #1a252f; border-radius: 10px; padding: 15px; border: 4px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8); flex-grow: 1; display: flex; flex-direction: column; overflow: hidden;
        }

        .screen-header { display: flex; justify-content: flex-end; gap: 10px; margin-bottom: 10px; flex-shrink: 0; }

        /* Angepasstes, freundlicheres Start-Menü */
        .start-screen {
            background: #ffffff; padding: 25px 20px; border-radius: 16px; max-width: 500px; margin: auto; 
            box-shadow: 0 8px 25px rgba(0,0,0,0.4); text-align: center; overflow-y: auto; max-height: 100%;
            border: 2px solid #ecf0f1;
        }
        .start-screen h1 { margin-top: 0; color: #e74c3c; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; }

        .control-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 16px; text-align: left; }
        .control-group label.main-label { font-size: 13px; font-weight: 700; color: #2c3e50; }
        input[type="text"], select { 
            padding: 12px; font-size: 15px; border: 2px solid #bdc3c7; border-radius: 8px; 
            background-color: #f8f9fa; transition: border-color 0.2s; outline: none;
        }
        input[type="text"]:focus, select:focus { border-color: #3498db; }
        
        .checkbox-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: #f8f9fa; padding: 12px; border-radius: 8px; border: 1px solid #e0e0e0; }
        .checkbox-grid label { font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; color: #333; padding: 4px 0;}
        .checkbox-grid input[type="checkbox"] { transform: scale(1.2); } /* Größere Checkboxen für Touch */

        .button-group { display: flex; gap: 10px; margin-top: 25px; flex-wrap: wrap;}
        button { 
            padding: 12px 15px; font-size: 14px; background-color: #3498db; color: white; border: none; 
            border-radius: 8px; cursor: pointer; font-weight: bold; flex: 1; min-width: 140px;
            transition: transform 0.1s, background-color 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active { transform: scale(0.97); }
        button:hover { background-color: #2980b9; }
        
        /* Header Buttons */
        button.settings-btn { background-color: #ecf0f1; color: #333; flex: none; display: none; border: 2px solid #bdc3c7; padding: 8px 12px; min-width: auto; box-shadow: none;}
        button.header-share-btn { background-color: #9b59b6; color: white; flex: none; display: none; border: 2px solid #8e44ad; padding: 8px 12px; min-width: auto; font-size: 13px; box-shadow: none;}
        button.header-share-btn:hover { background-color: #8e44ad; }
        
        button.random-btn { background-color: #e67e22; }
        button.share-btn { background-color: #9b59b6; }

        /* Support Banner */
        .support-banner {
            margin-top: 25px; padding: 15px; background: #fff8e1; border: 2px dashed #f1c40f;
            border-radius: 12px; font-size: 13px; color: #666; text-align: center;
        }
        .support-banner a {
            color: #d35400; font-weight: bold; text-decoration: none; display: inline-block;
            margin-top: 8px; padding: 8px 15px; border-radius: 6px; transition: background 0.2s; border: 1px solid #d35400;
        }
        .support-banner a:hover { background: #f1c40f; color: #fff; border-color: #f1c40f; }

        .game-info-container { display: none; flex-wrap: wrap; justify-content: center; gap: 10px; margin-bottom: 10px; flex-shrink: 0; width: 100%; }
        
        .target-container, .rule-container { 
            padding: 8px 15px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #fff; 
            display: flex; align-items: center; justify-content: center; flex-wrap: nowrap; flex: 1; min-width: 140px;
        }
        .target-container { background: linear-gradient(135deg, #f1c40f, #f39c12); border: 2px solid #d68910; gap: 8px;}
        .rule-container { background: linear-gradient(135deg, #9b59b6, #8e44ad); border: 2px solid #732d91; flex-direction: column; }
        
        .target-container h2 { margin: 0; font-size: 12px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); text-transform: uppercase; white-space: nowrap;}
        #targetInfo { display: flex; align-items: center; gap: 8px; }
        #targetInfo .name { font-size: 15px !important; font-weight: bold; white-space: nowrap; margin: 0; color: #fff;}

        .rule-container h2 { margin: 0 0 2px 0; font-size: 10px; text-transform: uppercase; color: #e8d4f0; letter-spacing: 1px;}
        .rule-text { font-size: 13px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

        .main-game-area { display: none; flex-grow: 1; min-height: 0; height: 100%; width: 100%; overflow: hidden; }
        .grid-wrapper { flex-grow: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; display: flex; flex-direction: column; padding-right: 5px;}
        
        /* Scrollbar Styling für Webkit */
        .grid-wrapper::-webkit-scrollbar { width: 6px; }
        .grid-wrapper::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        .grid-wrapper::-webkit-scrollbar-thumb { background: #7f8c8d; border-radius: 4px; }

        :root { --cols: 6; --rows: 4; }
        .grid { 
            display: grid; grid-template-columns: repeat(var(--cols), 1fr); 
            grid-template-rows: repeat(var(--rows), minmax(100px, 1fr)); 
            gap: 1vmin; width: 100%; 
        }
        
        .card {
            background: #ffffff; border-radius: 8px; padding: 0.5vmin 1vmin; text-align: center; border: 3px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; user-select: none; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; width: 100%; height: 100%; min-height: 100px; box-sizing: border-box; 
            transition: transform 0.1s, border-color 0.1s; overflow: hidden; position: relative;
        }
        .card:hover { border-color: #e74c3c; transform: scale(1.02); z-index: 10; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .card.eliminated { opacity: 0.25; filter: grayscale(100%) brightness(0.5); background-color: #e9ecef; border-color: #555; }
        .card.my-target { border: 4px solid #f1c40f !important; box-shadow: 0 0 15px #f1c40f, inset 0 0 10px rgba(241,196,15,0.3); z-index: 5; }
        .card.my-target.eliminated { opacity: 0.45; filter: grayscale(50%) brightness(0.6); }

        .card-header { display: flex; justify-content: space-between; width: 100%; font-size: clamp(9px, 1.2vmin, 12px); margin-bottom: 2px; color: #666; font-weight: bold; flex-shrink: 0;}
        .gen-badge { background: #ecf0f1; padding: 2px 4px; border-radius: 4px; }
        .id-link { color: #3498db; text-decoration: none; }
        .id-link:hover { text-decoration: underline; color: #e74c3c; }

        .card img { max-width: 95%; height: auto; max-height: 55%; min-height: 40px; object-fit: contain; flex-shrink: 1; pointer-events: none;}
        .name { font-weight: bold; text-transform: capitalize; font-size: clamp(11px, 1.5vmin, 16px); color: #222; margin: 4px 0 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; flex-shrink: 0; pointer-events: none;}
        .types { font-size: clamp(9px, 1.2vmin, 12px); color: #fff; background: #7f8c8d; padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; flex-shrink: 0;}
        .card-size { font-size: clamp(9px, 1.1vmin, 11px); color: #7f8c8d; margin-top: 2px; flex-shrink: 0;}

        /* Tooltip */
        .mouse-tooltip {
            position: fixed; background: rgba(26, 37, 47, 0.95); color: #ecf0f1; padding: 8px 12px; border-radius: 8px;
            border: 2px solid #3498db; pointer-events: none; z-index: 10000; display: none; font-size: 13px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5); white-space: nowrap; text-align: center;
        }
        .mouse-tooltip .t-gen { font-weight: bold; color: #f1c40f; margin-bottom: 4px; display: block; font-size: 13px; }
        .mouse-tooltip .t-types { background: #7f8c8d; padding: 3px 6px; border-radius: 4px; font-size: 11px; margin-bottom: 4px; display: inline-block; color: white; }
        .mouse-tooltip .t-size { color: #bdc3c7; font-size: 11px; display: block; }
        .mouse-tooltip .t-big-title { font-weight: bold; color: #f1c40f; font-size: 15px; margin-bottom: 5px; text-transform: uppercase;}

        #loading { display: none; font-size: 18px; text-align: center; font-weight: bold; margin: auto; color: #fff; }
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.8); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 16px; width: 90%; max-width: 450px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 28px; cursor: pointer; color: #666; line-height: 1;}
        
        /* Toast Notification */
        #toast { visibility: hidden; min-width: 250px; background-color: #2ecc71; color: #fff; text-align: center; border-radius: 8px; padding: 12px; position: fixed; z-index: 10000; left: 50%; bottom: 30px; transform: translateX(-50%); font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); font-size: 14px;}
        #toast.show { visibility: visible; animation: fadein 0.5s, fadeout 0.5s 2.5s; }
        @keyframes fadein { from {bottom: 0; opacity: 0;} to {bottom: 30px; opacity: 1;} }
        @keyframes fadeout { from {bottom: 30px; opacity: 1;} to {bottom: 0; opacity: 0;} }

        /* =========================================
           MOBILE OPTIMIERUNGEN (Media Queries)
           ========================================= */
        @media (max-width: 768px) {
            body { padding: 0; }
            .pokedex { border-radius: 0; border: none; padding: 10px; }
            .screen-container { padding: 10px; border-width: 2px;}
            
            .start-screen { padding: 15px; width: 100%; box-sizing: border-box; border: none;}
            .start-screen h1 { font-size: 22px; }
            
            .button-group { flex-direction: column; }
            .button-group button { width: 100%; }
            
            /* UI anpassen für mehr Platz im Spiel */
            .game-info-container { flex-direction: column; gap: 8px; }
            .target-container, .rule-container { width: 100%; box-sizing: border-box; }
            
            /* Grid für Handys überschreiben - zwingt es in eine scrollbare 3er oder 4er Ansicht */
            .grid { 
                grid-template-columns: repeat(3, 1fr) !important; 
                grid-template-rows: auto !important; 
            }
            .card { min-height: 120px; } /* Gut treffbar mit dem Finger */
            .name { font-size: 12px; }
            .card img { min-height: 45px; }
        }

        /* Für sehr schmale Displays (z.B. iPhone SE) */
        @media (max-width: 380px) {
            .grid { grid-template-columns: repeat(2, 1fr) !important; }
            .card { min-height: 140px; }
            .checkbox-grid { grid-template-columns: 1fr; } /* Checkboxen untereinander */
        }
    </style>
</head>
<body>

    <div id="mouseTooltip" class="mouse-tooltip"></div>
    <div id="toast">Invite-Code kopiert!</div>

    <div class="pokedex">
        <div class="lights">
            <div class="light-main"></div>
            <div class="light-small light-red"></div>
            <div class="light-small light-yellow"></div>
            <div class="light-small light-green"></div>
        </div>

        <div class="screen-container">
            <div class="screen-header">
                <button id="headerShareBtn" class="header-share-btn" onclick="copyInviteCode(false)">🔗 Code kopieren</button>
                <button id="settingsBtn" class="settings-btn" onclick="openModal()">⚙️ Settings</button>
            </div>

            <div id="startScreen" class="start-screen">
                <h1 id="uiTitle">Wer bin ich? 🔍</h1>
                <p id="uiDesc" style="color: #555; font-size: 14px; margin-bottom: 20px; line-height: 1.4;">
                    Schnapp dir einen Freund, gebt dasselbe Geheimwort ein und ratet los!
                </p>
                
                <div class="control-group">
                    <label class="main-label" for="startLanguage">🌍 Sprache / Language</label>
                    <select id="startLanguage" onchange="updateUITexts()">
                        <option value="de" selected>Deutsch</option>
                        <option value="en">English</option>
                    </select>
                </div>
                
                <div class="control-group">
                    <label class="main-label" id="lblSeedStart" for="startSeed">🔑 Geheimwort ODER Invite-Code</label>
                    <input type="text" id="startSeed" placeholder="z.B. Pikachu99" oninput="checkInviteCode(this.value, false)">
                </div>
                
                <div class="control-group">
                    <label class="main-label" id="lblAmountStart" for="startPokemonCount">🔢 Anzahl der Pokémon</label>
                    <select id="startPokemonCount">
                        <option value="16">16 Pokémon (Kurze Runde)</option>
                        <option value="24" selected>24 Pokémon (Standard)</option>
                        <option value="36">36 Pokémon (Lang)</option>
                        <option value="48" id="optLgStart">48 Pokémon (Groß)</option>
                        <option value="64" id="optXlStart">64 Pokémon (Riesig)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="main-label" id="lblInfoStart" for="startInfoMode">ℹ️ Zusatz-Infos (Typen, Gen, Maße)</label>
                    <select id="startInfoMode">
                        <option value="tooltip" id="optHoverStart" selected>Nur beim Antippen / Hover</option>
                        <option value="always" id="optAlwaysStart">Immer anzeigen</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="main-label" id="lblRegionsStart">🗺️ Regionen</label>
                    <div class="checkbox-grid" id="startGenCheckboxes">
                        <label><input type="checkbox" value="1" checked class="gen-cb"> Kanto (Gen 1)</label>
                        <label><input type="checkbox" value="2" class="gen-cb"> Johto (Gen 2)</label>
                        <label><input type="checkbox" value="3" class="gen-cb"> Hoenn (Gen 3)</label>
                        <label><input type="checkbox" value="4" class="gen-cb"> Sinnoh (Gen 4)</label>
                        <label><input type="checkbox" value="5" class="gen-cb"> Einall (Gen 5)</label>
                        <label><input type="checkbox" value="6" class="gen-cb"> Kalos (Gen 6)</label>
                        <label><input type="checkbox" value="7" class="gen-cb"> Alola (Gen 7)</label>
                        <label><input type="checkbox" value="8" class="gen-cb"> Galar (Gen 8)</label>
                        <label><input type="checkbox" value="9" class="gen-cb"> Paldea (Gen 9)</label>
                    </div>
                </div>
                
                <div class="button-group">
                    <button id="btnStartGame" onclick="startGame(false)">🚀 Spiel starten</button>
                    <button id="btnRandomSeed" class="random-btn" onclick="generateRandomGame(false)">🎲 Zufallsrunde</button>
                    <button id="btnShare" class="share-btn" onclick="copyInviteCode(false)">🔗 Code senden</button>
                </div>

                <div class="support-banner" id="supportBanner">
                    <span id="supportText">Dir gefällt das Spiel? Unterstütze mich gerne freiwillig:</span><br>
                    <a href="https://paypal.me/LarsiiiiHasi" target="_blank" id="supportLink">☕ PayPal Spende</a>
                </div>
            </div>

            <div id="gameInfoContainer" class="game-info-container">
                <div class="target-container">
                    <h2 id="targetTitle">Ziel:</h2>
                    <div id="targetInfo"></div>
                </div>
                <div class="rule-container">
                    <h2 id="ruleTitle">Sonderregel</h2>
                    <div id="ruleText" class="rule-text"></div>
                </div>
            </div>

            <div id="loading">Pokédex durchsucht die Datenbank...</div>
            
            <div id="mainGameArea" class="main-game-area">
                <div class="grid-wrapper" id="gridWrapper">
                    <div id="board" class="grid"></div>
                </div>
                </div>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 id="modalTitleText" style="margin-top: 0; color: #333; text-align: center;">⚙️ Einstellungen</h2>
            <div class="control-group">
                <label class="main-label" for="modalLanguage">🌍 Sprache</label>
                <select id="modalLanguage" onchange="updateUITexts()"><option value="de" selected>Deutsch</option><option value="en">English</option></select>
            </div>
            <div class="control-group">
                <label class="main-label" id="lblSeedModal" for="modalSeed">🔑 Geheimwort ODER Invite-Code</label>
                <input type="text" id="modalSeed" oninput="checkInviteCode(this.value, true)">
            </div>
            <div class="control-group">
                <label class="main-label" id="lblAmountModal" for="modalPokemonCount">🔢 Anzahl der Pokémon</label>
                <select id="modalPokemonCount"><option value="16">16</option><option value="24">24</option><option value="36">36</option><option value="48" id="optLgModal">48 (Groß)</option><option value="64" id="optXlModal">64 (Riesig)</option></select>
            </div>
            <div class="control-group">
                <label class="main-label" id="lblInfoModal" for="modalInfoMode">ℹ️ Zusatz-Infos</label>
                <select id="modalInfoMode">
                    <option value="tooltip" id="optHoverModal" selected>Beim Antippen</option>
                    <option value="always" id="optAlwaysModal">Immer anzeigen</option>
                </select>
            </div>
            <div class="control-group"><label class="main-label" id="lblRegionsModal">🗺️ Regionen</label><div class="checkbox-grid" id="modalGenCheckboxes"></div></div>
            <div class="button-group">
                <button id="btnApply" onclick="startGame(true)">💾 Speichern & Laden</button>
                <button id="btnRandomModal" class="random-btn" onclick="generateRandomGame(true)">🎲 Zufall</button>
                <button id="btnShareModal" class="share-btn" onclick="copyInviteCode(true)">🔗 Code</button>
            </div>
        </div>
    </div>

    <script>
        let currentTotalPokemon = 0;
        const typesDE = { "normal": "Normal", "
