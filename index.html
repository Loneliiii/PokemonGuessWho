<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<link rel="stylesheet" href="style.css">
<script src="pokemon_data.js"></script>

<style>

/* Container */
.container {
  width:100%;
  max-width:900px;
}

/* Panel */
.panel {
  background:rgba(22,27,34,0.9);
  backdrop-filter: blur(10px);
  padding:20px;
  border-radius:16px;
  text-align:center;
}

/* Grid */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(80px,1fr));
  gap:10px;
}

.card {
  background:#21262d;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
  transform:scale(0);
  opacity:0;
  transition:0.3s ease;
}

.card.show {
  transform:scale(1);
  opacity:1;
}

.card img {
  width:64px;
}

/* TYPES */
.types {
  display:flex;
  justify-content:center;
  flex-wrap:wrap;
  gap:3px;
}

.type {
  font-size:10px;
  padding:2px 6px;
  border-radius:6px;
  color:white;
}

.normal{background:#A8A77A;}
.fire{background:#EE8130;}
.water{background:#6390F0;}
.grass{background:#7AC74C;}
.electric{background:#F7D02C;color:black;}
.ice{background:#96D9D6;}
.fighting{background:#C22E28;}
.poison{background:#A33EA1;}
.ground{background:#E2BF65;color:black;}
.flying{background:#A98FF3;}
.psychic{background:#F95587;}
.bug{background:#A6B91A;}
.rock{background:#B6A136;}
.ghost{background:#735797;}
.dragon{background:#6F35FC;}
.dark{background:#705848;}
.steel{background:#B7B7CE;color:black;}
.fairy{background:#D685AD;}

/* DEBUG BOX */
#debug {
  position:fixed;
  bottom:10px;
  left:10px;
  background:#000;
  color:#0f0;
  padding:5px;
  font-size:10px;
  max-width:90%;
}

</style>
</head>

<body>

<div class="container">

<div id="menu" class="panel">
  <h2>Wer bin ich?</h2>
  <input id="seedInput" placeholder="Seed"><br>

  <button onclick="startGame()">Start</button>
</div>

<div id="game" class="panel" style="display:none;">
  <button onclick="back()">⬅ Neue Runde</button>
  <div id="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<div id="debug"></div>

<script>
let seedValue=0;

/* FULL TYPE MAP */
const TYPE_NAMES = {
  normal:{de:"Normal",en:"Normal"},
  fire:{de:"Feuer",en:"Fire"},
  water:{de:"Wasser",en:"Water"},
  grass:{de:"Pflanze",en:"Grass"},
  electric:{de:"Elektro",en:"Electric"},
  ice:{de:"Eis",en:"Ice"},
  fighting:{de:"Kampf",en:"Fighting"},
  poison:{de:"Gift",en:"Poison"},
  ground:{de:"Boden",en:"Ground"},
  flying:{de:"Flug",en:"Flying"},
  psychic:{de:"Psycho",en:"Psychic"},
  bug:{de:"Käfer",en:"Bug"},
  rock:{de:"Gestein",en:"Rock"},
  ghost:{de:"Geist",en:"Ghost"},
  dragon:{de:"Drache",en:"Dragon"},
  dark:{de:"Unlicht",en:"Dark"},
  steel:{de:"Stahl",en:"Steel"},
  fairy:{de:"Fee",en:"Fairy"}
};

/* SAFE LOG */
function log(msg){
  document.getElementById("debug").innerText = msg;
}

/* RNG */
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h=Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

/* SAFE IMAGE */
function createImage(src){
  let img=document.createElement("img");
  img.src=src;
  img.onerror=()=>{
    img.src="https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/pokemon/0.png";
  };
  return img;
}

/* START */
function startGame(){

  try {

    seedValue = hash(seedInput.value || "random");

    let pool = Array.isArray(POKEMON) ? [...POKEMON] : [];

    if(pool.length === 0){
      log("❌ Pokemon data missing");
      return;
    }

    pool.sort(()=>rand()-0.5);
    let data = pool.slice(0,24);

    let target = data[Math.floor(rand()*data.length)];

    menu.style.display="none";
    game.style.display="block";

    board.innerHTML="";

    data.forEach((p,i)=>{

      try {

        let card=document.createElement("div");
        card.className="card";

        let name = p.name_en || "???";
        let img = createImage(p.img || "");

        let typesHTML = (p.types || []).map(t=>{
          let label = TYPE_NAMES[t]?.en || t || "?";
          return `<span class="type ${t}">${label}</span>`;
        }).join("");

        card.appendChild(img);

        let title=document.createElement("div");
        title.innerText=name;
        card.appendChild(title);

        let types=document.createElement("div");
        types.className="types";
        types.innerHTML=typesHTML;
        card.appendChild(types);

        card.onclick=()=>card.classList.toggle("off");

        board.appendChild(card);

        setTimeout(()=>card.classList.add("show"), i*30);

      } catch(e){
        log("Card error: "+e);
      }

    });

    targetDiv.innerText="You are: "+(target.name_en || "???");

  } catch(e){
    log("Fatal error: "+e);
  }
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}
</script>

</body>
</html>
