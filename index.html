<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<link rel="stylesheet" href="style.css">
<script src="pokemon_data.js"></script>

<style>

/* Popup */
#popup {
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

.popup-box {
  background:#161b22;
  padding:20px;
  border-radius:16px;
  max-width:300px;
  text-align:center;
}

.popup-box img {
  width:96px;
}

.popup-box a {
  color:#58a6ff;
  text-decoration:none;
}

/* rest bleibt gleich */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(80px,1fr));
  gap:10px;
}

.card {
  background:#21262d;
  padding:8px;
  border-radius:10px;
  cursor:pointer;
  transform:scale(0);
  opacity:0;
  transition:0.3s;
}

.card.show { transform:scale(1); opacity:1; }

.card img { width:64px; }

.card.off { opacity:0.3; }

</style>
</head>

<body>

<div class="container">

<div id="menu" class="panel">
  <div class="title">Wer bin ich?</div>

  <input id="seedInput" placeholder="Seed"><br>
  <input id="playerInput" placeholder="Name"><br>

  <button onclick="startGame()">Start</button>
</div>

<div id="game" class="panel" style="display:none;">
  <button onclick="back()">⬅ Neue Runde</button>
  <div id="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<!-- 🔥 POPUP -->
<div id="popup" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <img id="popImg">
    <h3 id="popName"></h3>
    <div id="popTypes"></div>
    <div id="popDex"></div>
    <div id="popEvo"></div>
    <br>
    <a id="popLink" target="_blank">PokéWiki öffnen</a>
    <br><br>
    <button onclick="closePopup()">Schließen</button>
  </div>
</div>

<script>

let seedValue=0;
let holdTimer=null;

/* RNG */
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h=Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

/* Popup */
function showPopup(p){

  document.getElementById("popup").style.display="flex";

  popImg.src=p.img;
  popName.innerText=p.name_de + " / " + p.name_en;

  popDex.innerText="Dex: #" + p.id;

  popTypes.innerText="Typ: " + (p.types || []).join(", ");

  popEvo.innerText = p.evolution || "Keine Daten";

  popLink.href="https://www.pokewiki.de/" + p.name_de;
}

function closePopup(){
  document.getElementById("popup").style.display="none";
}

/* START */
function startGame(){

  seedValue=hash(seedInput.value || "random");

  let pool=[...POKEMON];

  // deterministic shuffle
  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(rand() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

  let data=pool.slice(0,24);

  let playerId=playerInput.value || "player";
  let target=data[Math.abs(hash(seedInput.value + playerId)) % data.length];

  menu.style.display="none";
  game.style.display="block";

  board.innerHTML="";

  data.forEach((p,i)=>{

    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.img}">
      <div>${p.name_de}</div>
    `;

    // CLICK (normal)
    card.onclick=()=>card.classList.toggle("off");

    // 🔥 HOLD
    card.onmousedown=card.ontouchstart=()=>{
      holdTimer=setTimeout(()=>{
        showPopup(p);
      },500);
    };

    card.onmouseup=card.ontouchend=()=>{
      clearTimeout(holdTimer);
    };

    board.appendChild(card);

    setTimeout(()=>card.classList.add("show"), i*30);
  });

  target.innerText="Du bist: " + target.name_de;
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

</script>

</body>
</html>
