<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon - Guess Who?</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #2c3e50;
            color: #333;
            margin: 0;
            padding: 2vmin;
            height: 100vh;
            box-sizing: border-box;
            display: flex;
            justify-content: center;
            overflow: hidden; 
        }
        
        .pokedex {
            background-color: #dc0a2d;
            width: 100%; 
            max-width: 1600px;
            height: 100%; 
            border-radius: 15px;
            padding: 15px;
            box-shadow: inset -5px -5px 15px rgba(0,0,0,0.2), 5px 10px 20px rgba(0,0,0,0.5);
            border: 4px solid #8b0000;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
        }

        .lights {
            display: flex;
            align-items: flex-start;
            gap: 15px;
            margin-bottom: 15px;
            flex-shrink: 0; 
        }

        .light-main {
            width: 50px;
            height: 50px;
            background-color: #28aafa;
            border-radius: 50%;
            border: 3px solid #fff;
            box-shadow: 0 0 10px #28aafa, inset -5px -5px 10px rgba(0,0,0,0.3);
        }

        .light-small {
            width: 15px; height: 15px; border-radius: 50%; border: 2px solid #333; box-shadow: inset -2px -2px 5px rgba(0,0,0,0.3);
        }
        .light-red { background-color: #ff2c2c; }
        .light-yellow { background-color: #fdfd28; }
        .light-green { background-color: #28fd28; }

        .screen-container {
            background-color: #1a252f; 
            border-radius: 10px;
            padding: 15px;
            border: 4px solid #111;
            box-shadow: inset 0 0 20px rgba(0,0,0,0.8);
            flex-grow: 1; 
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .screen-header { display: flex; justify-content: flex-end; margin-bottom: 10px; flex-shrink: 0; }

        /* Start Screen */
        .start-screen {
            background: #fff; padding: 20px 30px; border-radius: 12px; max-width: 550px; margin: auto; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.3); text-align: center;
        }
        .start-screen h1 { margin-top: 0; color: #2c3e50; font-size: 24px; }

        /* Forms & Inputs */
        .control-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; text-align: left; }
        .control-group label.main-label { font-size: 12px; font-weight: bold; color: #555; text-transform: uppercase; }
        input[type="text"], select { padding: 8px 10px; font-size: 14px; border: 2px solid #e0e0e0; border-radius: 6px; background-color: #fafafa; }
        
        .checkbox-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; background: #f8f9fa; padding: 10px; border-radius: 6px; border: 1px solid #e0e0e0;
        }
        .checkbox-grid label { font-size: 13px; font-weight: normal; display: flex; align-items: center; gap: 6px; cursor: pointer; color: #333; text-transform: none; }

        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        button { padding: 10px 15px; font-size: 14px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; flex: 1; }
        button:hover { background-color: #2980b9; }
        button.settings-btn { background-color: #ecf0f1; color: #333; flex: none; display: none; border: 2px solid #bdc3c7; padding: 6px 12px;}
        button.settings-btn:hover { background-color: #bdc3c7; }
        button.random-btn { background-color: #e67e22; }
        button.random-btn:hover { background-color: #d35400; }

        /* Modal */
        .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #fff; padding: 25px; border-radius: 12px; width: 90%; max-width: 450px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 24px; cursor: pointer; color: #666; }

        /* Game Header (Target + Rule) */
        .game-info-container {
            display: none; /* Flex when active */
            flex-wrap: wrap;
            justify-content: center;
            gap: 20px;
            margin-bottom: 15px;
            flex-shrink: 0;
            width: 100%;
        }

        .target-container {
            background: linear-gradient(135deg, #f1c40f, #f39c12); padding: 8px 15px; border-radius: 8px;
            text-align: center; border: 2px solid #d68910; box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #fff; display: flex; align-items: center; justify-content: center; gap: 15px;
        }
        .target-container h2 { margin: 0; font-size: 14px; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); text-transform: uppercase; }

        .rule-container {
            background: linear-gradient(135deg, #9b59b6, #8e44ad); padding: 8px 15px; border-radius: 8px;
            text-align: center; border: 2px solid #732d91; box-shadow: 0 4px 6px rgba(0,0,0,0.3); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-width: 250px;
        }
        .rule-container h2 { margin: 0 0 4px 0; font-size: 11px; text-transform: uppercase; color: #e8d4f0; letter-spacing: 1px;}
        .rule-text { font-size: 15px; font-weight: bold; text-shadow: 1px 1px 2px rgba(0,0,0,0.2); }

        /* Grid */
        :root { --cols: 6; --rows: 4; }
        .grid {
            display: none; grid-template-columns: repeat(var(--cols), 1fr); grid-template-rows: repeat(var(--rows), 1fr); gap: 1vmin; flex-grow: 1; min-height: 0; height: 100%; width: 100%;
        }
        
        .card {
            background: #ffffff; border-radius: 8px; padding: 0.5vmin; text-align: center; border: 3px solid #ddd;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2); cursor: pointer; user-select: none; display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; box-sizing: border-box; transition: transform 0.1s, border-color 0.1s; overflow: hidden;
        }
        .card:hover { border-color: #e74c3c; transform: scale(1.03); z-index: 10; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        
        .card img { max-width: 95%; height: auto; max-height: 65%; object-fit: contain; flex-shrink: 1; }
        
        .card.eliminated { opacity: 0.25; filter: grayscale(100%) brightness(0.5); background-color: #e9ecef; border-color: #555; }
        
        .name { font-weight: bold; text-transform: capitalize; font-size: clamp(10px, 1.8vmin, 18px); color: #222; margin: 4px 0 2px 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; width: 100%; }
        .types { font-size: clamp(8px, 1.2vmin, 13px); color: #fff; background: #7f8c8d; padding: 2px 6px; border-radius: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 95%; }

        #loading { display: none; font-size: 18px; text-align: center; font-weight: bold; margin: auto; color: #fff; }
        .footer-disclaimer { margin-top: 15px; text-align: center; color: #7f8c8d; font-size: 12px; }
    </style>
</head>
<body>

    <div class="pokedex">
        <div class="lights">
            <div class="light-main"></div>
            <div class="light-small light-red"></div>
            <div class="light-small light-yellow"></div>
            <div class="light-small light-green"></div>
        </div>

        <div class="screen-container">
            <div class="screen-header">
                <button id="settingsBtn" class="settings-btn" onclick="openModal()">⚙️ Settings</button>
            </div>

            <div id="startScreen" class="start-screen">
                <h1>Who's that Pokémon?</h1>
                <p style="color: #666; font-size: 13px; margin-bottom: 15px;">Enter a shared seed to play on the exact same board!</p>
                
                <div class="control-group">
                    <label class="main-label" for="startSeed">Secret Word / Seed</label>
                    <input type="text" id="startSeed" placeholder="e.g. Charizard99">
                </div>
                
                <div class="control-group">
                    <label class="main-label" for="startPokemonCount">Amount of Pokémon</label>
                    <select id="startPokemonCount">
                        <option value="16">16 Pokémon</option>
                        <option value="24" selected>24 Pokémon</option>
                        <option value="36">36 Pokémon</option>
                        <option value="48">48 Pokémon (Large)</option>
                        <option value="64">64 Pokémon (Massive)</option>
                    </select>
                </div>

                <div class="control-group">
                    <label class="main-label">Regions (Combine as you like)</label>
                    <div class="checkbox-grid" id="startGenCheckboxes">
                        <label><input type="checkbox" value="1" checked class="gen-cb"> Kanto (Gen 1)</label>
                        <label><input type="checkbox" value="2" class="gen-cb"> Johto (Gen 2)</label>
                        <label><input type="checkbox" value="3" class="gen-cb"> Hoenn (Gen 3)</label>
                        <label><input type="checkbox" value="4" class="gen-cb"> Sinnoh (Gen 4)</label>
                        <label><input type="checkbox" value="5" class="gen-cb"> Unova (Gen 5)</label>
                        <label><input type="checkbox" value="6" class="gen-cb"> Kalos (Gen 6)</label>
                        <label><input type="checkbox" value="7" class="gen-cb"> Alola (Gen 7)</label>
                        <label><input type="checkbox" value="8" class="gen-cb"> Galar (Gen 8)</label>
                        <label><input type="checkbox" value="9" class="gen-cb"> Paldea (Gen 9)</label>
                    </div>
                </div>

                <div class="button-group">
                    <button onclick="startGame(false)">Start Game</button>
                    <button class="random-btn" onclick="generateRandomGame(false)">Random Seed</button>
                </div>
            </div>

            <div id="gameInfoContainer" class="game-info-container">
                <div class="target-container">
                    <h2>You are:</h2>
                    <div id="targetInfo" style="display: flex; align-items: center; gap: 10px;"></div>
                </div>
                <div class="rule-container">
                    <h2>Special Rule</h2>
                    <div id="ruleText" class="rule-text"></div>
                </div>
            </div>

            <div id="loading">Pokédex is searching the database...</div>
            <div id="board" class="grid"></div>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <h2 style="margin-top: 0; color: #333; text-align: center;">Game Settings</h2>
            
            <div class="control-group">
                <label class="main-label" for="modalSeed">Secret Word / Seed</label>
                <input type="text" id="modalSeed">
            </div>
            
            <div class="control-group">
                <label class="main-label" for="modalPokemonCount">Amount of Pokémon</label>
                <select id="modalPokemonCount">
                    <option value="16">16 Pokémon</option>
                    <option value="24">24 Pokémon</option>
                    <option value="36">36 Pokémon</option>
                    <option value="48">48 Pokémon (Large)</option>
                    <option value="64">64 Pokémon (Massive)</option>
                </select>
            </div>

            <div class="control-group">
                <label class="main-label">Regions</label>
                <div class="checkbox-grid" id="modalGenCheckboxes">
                    </div>
            </div>

            <div class="button-group">
                <button onclick="startGame(true)">Apply & Reload</button>
                <button class="random-btn" onclick="generateRandomGame(true)">Random Seed</button>
            </div>
        </div>
    </div>

    <script>
        let currentTotalPokemon = 0;

        // --- Custom Game Rules ---
        const gameRules = [
            "Normal Game (No restrictions) ✅",
            "No questions about Colors! 🎨",
            "No questions about Types! 🔥💧",
            "No questions about Evolutions! 🔄",
            "No questions about Body Shape (Arms, Legs, Wings)! 🦵",
            "No questions about the Generation/Region! 🌍",
            "No questions about the starting letter! 🔠"
        ];

        function openModal() { document.getElementById('settingsModal').style.display = 'flex'; }
        function closeModal() { document.getElementById('settingsModal').style.display = 'none'; }
        window.onclick = function(event) { if (event.target == document.getElementById('settingsModal')) closeModal(); }

        const generations = {
            "1": { min: 1, max: 151 }, "2": { min: 152, max: 251 }, "3": { min: 252, max: 386 },
            "4": { min: 387, max: 493 }, "5": { min: 494, max: 649 }, "6": { min: 650, max: 721 },
            "7": { min: 722, max: 809 }, "8": { min: 810, max: 898 }, "9": { min: 899, max: 1025 }
        };

        document.getElementById('modalGenCheckboxes').innerHTML = document.getElementById('startGenCheckboxes').innerHTML;

        function cyrb128(str) {
            let h1 = 1779033703, h2 = 3144134277, h3 = 1013904242, h4 = 2773480762;
            for (let i = 0, k; i < str.length; i++) {
                k = str.charCodeAt(i);
                h1 = h2 ^ Math.imul(h1 ^ k, 597399067); h2 = h3 ^ Math.imul(h2 ^ k, 2869860233);
                h3 = h4 ^ Math.imul(h3 ^ k, 951274213); h4 = h1 ^ Math.imul(h4 ^ k, 2716044179);
            }
            h1 = Math.imul(h3 ^ (h1 >>> 18), 597399067); h2 = Math.imul(h4 ^ (h2 >>> 22), 2869860233);
            h3 = Math.imul(h1 ^ (h3 >>> 17), 2716044179); h4 = Math.imul(h2 ^ (h4 >>> 19), 3144134277);
            return [(h1^h2^h3^h4)>>>0, (h2^h1)>>>0, (h3^h1)>>>0, (h4^h1)>>>0];
        }

        function sfc32(a, b, c, d) {
            return function() {
              a >>>= 0; b >>>= 0; c >>>= 0; d >>>= 0; 
              var t = (a + b | 0) + d | 0; d = d + 1 | 0;
              a = b ^ b >>> 9; b = c + (c << 3) | 0; c = (c << 21 | c >>> 11); c = c + t | 0;
              return (t >>> 0) / 4294967296;
            }
        }

        function calculateOptimalGrid(total) {
            if (!total) return;
            const board = document.getElementById('board');
            const width = board.clientWidth;
            const height = board.clientHeight;
            if (width === 0 || height === 0) return;

            let bestCols = 1; let bestRows = total; let maxCardSize = 0;
            const targetRatio = 1.1; 

            for (let cols = 1; cols <= total; cols++) {
                let rows = Math.ceil(total / cols);
                let cellWidth = width / cols;
                let cellHeight = height / rows;
                let effectiveWidth = Math.min(cellWidth, cellHeight / targetRatio);
                
                if (effectiveWidth > maxCardSize) {
                    maxCardSize = effectiveWidth; bestCols = cols; bestRows = rows;
                }
            }
            document.documentElement.style.setProperty('--cols', bestCols);
            document.documentElement.style.setProperty('--rows', bestRows);
        }

        window.addEventListener('resize', () => calculateOptimalGrid(currentTotalPokemon));

        function generateRandomGame(isFromModal) {
            const randomSeed = Math.random().toString(36).substring(2, 8).toUpperCase();
            document.getElementById(isFromModal ? 'modalSeed' : 'startSeed').value = randomSeed;
            startGame(isFromModal);
        }

        function syncCheckboxes(sourceId, targetId) {
            const sourceCbs = document.getElementById(sourceId).querySelectorAll('input[type="checkbox"]');
            const targetCbs = document.getElementById(targetId).querySelectorAll('input[type="checkbox"]');
            sourceCbs.forEach((cb, index) => { targetCbs[index].checked = cb.checked; });
        }

        async function startGame(isFromModal) {
            const seedId = isFromModal ? 'modalSeed' : 'startSeed';
            const countId = isFromModal ? 'modalPokemonCount' : 'startPokemonCount';
            const genContainerId = isFromModal ? 'modalGenCheckboxes' : 'startGenCheckboxes';

            const seed = document.getElementById(seedId).value;
            const totalPokemon = parseInt(document.getElementById(countId).value);

            document.getElementById('modalSeed').value = seed;
            document.getElementById('startSeed').value = seed;
            document.getElementById('modalPokemonCount').value = totalPokemon;
            document.getElementById('startPokemonCount').value = totalPokemon;
            syncCheckboxes(genContainerId, isFromModal ? 'startGenCheckboxes' : 'modalGenCheckboxes');

            currentTotalPokemon = totalPokemon;

            const checkedBoxes = document.getElementById(genContainerId).querySelectorAll('input[type="checkbox"]:checked');
            const selectedGens = Array.from(checkedBoxes).map(cb => cb.value);

            if (!seed) { alert("Please enter a Seed!"); return; }
            if (selectedGens.length === 0) { alert("Please select at least one Region!"); return; }

            let validIdsPool = [];
            selectedGens.forEach(gen => {
                for (let i = generations[gen].min; i <= generations[gen].max; i++) {
                    validIdsPool.push(i);
                }
            });

            if (totalPokemon > validIdsPool.length) { 
                alert(`You selected ${totalPokemon} Pokémon, but the chosen regions only have ${validIdsPool.length} Pokémon in total. Please select more regions or a smaller grid!`); 
                return; 
            }

            if (isFromModal) closeModal();
            document.getElementById('startScreen').style.display = 'none';
            document.getElementById('settingsBtn').style.display = 'block'; 

            const board = document.getElementById('board');
            board.innerHTML = ''; board.style.display = 'none';
            document.getElementById('gameInfoContainer').style.display = 'none';
            document.getElementById('loading').style.display = 'block';

            const seedHash = cyrb128(seed);
            const rand = sfc32(seedHash[0], seedHash[1], seedHash[2], seedHash[3]);

            // --- Setze die gemeinsame, zufällige Spielregel ---
            // Da wir rand() nutzen, bekommt jeder mit demselben Seed auch dieselbe Regel!
            const ruleIndex = Math.floor(rand() * gameRules.length);
            document.getElementById('ruleText').textContent = gameRules[ruleIndex];

            const selectedIds = new Set();
            while(selectedIds.size < totalPokemon) {
                const randomIndex = Math.floor(rand() * validIdsPool.length);
                selectedIds.add(validIdsPool[randomIndex]);
            }

            await buildBoard(Array.from(selectedIds));
            
            document.getElementById('loading').style.display = 'none';
            document.getElementById('gameInfoContainer').style.display = 'flex';
            board.style.display = 'grid'; 
            calculateOptimalGrid(totalPokemon);
        }

        async function buildBoard(ids) {
            const board = document.getElementById('board');
            
            const promises = ids.map(id => fetch(`https://pokeapi.co/api/v2/pokemon/${id}`).then(res => res.json()));
            const pokemons = await Promise.all(promises);

            pokemons.forEach(pokemon => {
                const card = document.createElement('div');
                card.className = 'card';
                card.onclick = () => card.classList.toggle('eliminated');

                const img = document.createElement('img');
                img.src = pokemon.sprites.other['official-artwork'].front_default || pokemon.sprites.front_default;
                
                const name = document.createElement('div');
                name.className = 'name';
                name.textContent = pokemon.name;

                const types = document.createElement('div');
                types.className = 'types';
                types.textContent = pokemon.types.map(t => t.type.name).join(' / ');

                card.appendChild(img); card.appendChild(name); card.appendChild(types);
                board.appendChild(card);
            });

            // Dein Target-Pokémon (Bleibt lokal random, damit die Spieler nicht dasselbe bekommen)
            const myTarget = pokemons[Math.floor(Math.random() * pokemons.length)];
            const targetInfo = document.getElementById('targetInfo');
            const targetImg = myTarget.sprites.front_default || 'https://raw.githubusercontent.com/PokeAPI/sprites/master/sprites/items/poke-ball.png';
            
            targetInfo.innerHTML = `
                <img src="${targetImg}" alt="${myTarget.name}" style="width: 45px; height: 45px; background: white; border-radius: 50%; border: 2px solid white;">
                <div class="name" style="font-size: 18px; margin: 0; color: white; text-shadow: none;">${myTarget.name.toUpperCase()}</div>
            `;
        }
    </script>
</body>
</html>
