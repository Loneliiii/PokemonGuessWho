<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Who am I? – Pokédex</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#111;
}

.pokedex {
  background:#c0392b;
  min-height:100vh;
  padding:15px;
}

.screen {
  background:#ecf0f1;
  border-radius:15px;
  padding:15px;
  max-width:900px;
  margin:auto;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(90px,1fr));
  gap:8px;
}

.card {
  background:white;
  border-radius:10px;
  padding:5px;
  text-align:center;
  cursor:pointer;
  border:3px solid #ccc;
}

.card img { width:72px; }

.card.off { opacity:0.3; }

/* TYPE COLORS */
.normal { border-color:#A8A77A; }
.fire { border-color:#EE8130; }
.water { border-color:#6390F0; }
.electric { border-color:#F7D02C; }
.grass { border-color:#7AC74C; }
.ice { border-color:#96D9D6; }
.fighting { border-color:#C22E28; }
.poison { border-color:#A33EA1; }
.ground { border-color:#E2BF65; }
.flying { border-color:#A98FF3; }
.psychic { border-color:#F95587; }
.bug { border-color:#A6B91A; }
.rock { border-color:#B6A136; }
.ghost { border-color:#735797; }
.dragon { border-color:#6F35FC; }
.dark { border-color:#705848; }
.steel { border-color:#B7B7CE; }
.fairy { border-color:#D685AD; }

.target {
  background:#2ecc71;
  padding:10px;
  border-radius:10px;
  margin-bottom:10px;
}

button, input {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}
</style>
</head>

<body>

<div class="pokedex">

<!-- MENU -->
<div id="menu" class="screen">
  <h2>Who am I? 🔍</h2>
  <input id="playerName" placeholder="Your name"><br>
  <input id="seedInput" placeholder="Seed / Code"><br>
  <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="game" class="screen" style="display:none;">
  <button onclick="back()">⬅ Back</button>
  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<script>
let seedValue = 0;

function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

function shuffle(arr){
  for(let i=arr.length-1;i>0;i--){
    let j=Math.floor(rand()*(i+1));
    [arr[i],arr[j]]=[arr[j],arr[i]];
  }
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

async function startGame(){

  const player = playerName.value.trim();
  const seedInput = document.getElementById("seedInput").value.trim();

  if(!player){
    alert("Enter name");
    return;
  }

  seedValue = hash(seedInput || "random");

  menu.style.display="none";
  game.style.display="block";

  let ids=[];
  for(let i=1;i<=151;i++) ids.push(i);

  shuffle(ids);
  ids = ids.slice(0,24);

  board.innerHTML="Loading...";

  let data=[];

  for(let id of ids){
    let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    let p = await res.json();
    data.push(p);
  }

  board.innerHTML="";

  data.forEach(p=>{
    let card=document.createElement("div");

    // 🔥 Typen als Klassen
    let typeClasses = p.types.map(t=>t.type.name).join(" ");

    card.className="card " + typeClasses;

    card.innerHTML=`
      <img src="${p.sprites.front_default}">
      <div>${p.name}</div>
    `;

    card.onclick=()=>card.classList.toggle("off");

    board.appendChild(card);
  });

  let playerSeed = hash(seedInput + player);
  let targetIndex = Math.abs(playerSeed) % data.length;
  let target = data[targetIndex];

  document.getElementById("target").innerHTML =
    "You are: <b>"+target.name+"</b>";
}
</script>

</body>
</html>
