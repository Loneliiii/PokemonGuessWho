<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich? – Pokédex</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#111;
  color:white;
}

/* 📱 Wichtig: Scroll erlauben */
html, body {
  height:100%;
  overflow:auto;
}

/* Pokédex Gehäuse */
.pokedex {
  background:#c0392b;
  min-height:100vh;
  padding:15px;
  box-sizing:border-box;
}

/* Screen */
.screen {
  background:#ecf0f1;
  border-radius:15px;
  padding:15px;
  color:black;
  max-width:900px;
  margin:auto;
}

/* Grid */
.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(90px,1fr));
  gap:8px;
  margin-top:10px;
}

/* Cards */
.card {
  background:white;
  border-radius:10px;
  padding:5px;
  text-align:center;
  cursor:pointer;
  font-size:12px;
}

.card img {
  width:72px;
}

.card.off {
  opacity:0.3;
}

/* Top */
.top {
  text-align:center;
}

.target {
  background:#2ecc71;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
}

/* Menü */
input, select, button {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button {
  background:#2980b9;
  color:white;
}

.version {
  font-size:12px;
  opacity:0.6;
}
</style>

</head>

<body>

<div class="pokedex">

<!-- Menü -->
<div id="menu" class="screen top">
  <h2>Wer bin ich? 🔍</h2>
  <div class="version" id="version"></div>

  <input id="playerName" placeholder="Dein Name"><br>
  <input id="seedInput" placeholder="Code"><br>

  <select id="lang">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
  </select><br>

  <button onclick="startGame()">Start</button>
</div>

<!-- Spiel -->
<div id="game" class="screen" style="display:none;">
  <button onclick="back()">⬅ Back</button>

  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<script>
const VERSION = "v2.0.0";

document.getElementById("version").innerText = VERSION;

let seedValue = 0;

function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

async function getGermanName(id){
  let res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
  let data = await res.json();
  let de = data.names.find(n=>n.language.name==="de");
  return de ? de.name : data.name;
}

function back(){
  document.getElementById("game").style.display="none";
  document.getElementById("menu").style.display="block";
}

async function startGame(){

  const player = document.getElementById("playerName").value.trim();
  const seedInput = document.getElementById("seedInput").value.trim();
  const lang = document.getElementById("lang").value;

  if(!player){
    alert(lang==="de"?"Name fehlt":"Enter name");
    return;
  }

  seedValue = hash(seedInput || "random");

  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";

  let ids = [];
  for(let i=1;i<=151;i++) ids.push(i);

  ids.sort(()=>rand()-0.5);
  ids = ids.slice(0, 24);

  const board = document.getElementById("board");
  board.innerHTML = "Loading...";

  let data = [];

  for(let id of ids){
    let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    let p = await res.json();

    let displayName = lang==="de"
      ? await getGermanName(id)
      : p.name;

    data.push({...p, displayName});
  }

  board.innerHTML = "";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.sprites.front_default}">
      <div>${p.displayName}</div>
    `;

    card.onclick=()=>card.classList.toggle("off");

    board.appendChild(card);
  });

  let playerSeed = hash(seedInput + player);
  let targetIndex = Math.abs(playerSeed) % data.length;
  let target = data[targetIndex];

  document.getElementById("target").innerHTML =
    (lang==="de"?"Du bist: ":"You are: ")
    + "<b>"+target.displayName+"</b>";
}
</script>

</body>
</html>
