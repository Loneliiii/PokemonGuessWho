<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<style>
body {
  margin:0;
  font-family: Arial;
  background:#2c3e50;
  color:white;
  display:flex;
  justify-content:center;
  align-items:center;
  height:100vh;
}

.container { width:95%; max-width:900px; }

.panel {
  background:white;
  color:black;
  padding:20px;
  border-radius:12px;
  text-align:center;
}

.grid {
  display:grid;
  grid-template-columns: repeat(auto-fill,minmax(120px,1fr));
  gap:10px;
}

.card {
  background:white;
  color:black;
  padding:10px;
  border-radius:10px;
  cursor:pointer;
}

.card.off { opacity:0.3; }

button, input, select {
  padding:10px;
  margin:5px;
  border-radius:8px;
  border:none;
}

button {
  background:#3498db;
  color:white;
  cursor:pointer;
}

.topbar {
  display:flex;
  justify-content:space-between;
}

.target {
  background:#f1c40f;
  color:black;
  padding:10px;
  border-radius:10px;
  margin:10px 0;
}

.version {
  opacity:0.6;
  font-size:14px;
  margin-top:-10px;
  margin-bottom:10px;
}
</style>
</head>

<body>

<div class="container">

<div id="menu" class="panel">
  <h1 id="title">Wer bin ich? 🔍</h1>
  <div id="version" class="version"></div>

  <input id="playerName" placeholder="Dein Name"><br>
  <input id="seedInput" placeholder="Geheimwort / Code"><br>

  <select id="lang">
    <option value="de">Deutsch</option>
    <option value="en">English</option>
  </select><br>

  <button onclick="startGame()">🚀 Start</button>
</div>

<div id="game" style="display:none;">
  <div class="topbar">
    <button onclick="back()">⬅</button>
  </div>

  <div id="target" class="target"></div>
  <div id="board" class="grid"></div>
</div>

</div>

<script>
const VERSION = "v1.1.0";

let seedValue = 0;

// Version anzeigen
window.onload = () => {
  document.getElementById("version").innerText = VERSION;
};

// Hash
function hash(str){
  let h=0;
  for(let i=0;i<str.length;i++){
    h = Math.imul(31,h)+str.charCodeAt(i)|0;
  }
  return h;
}

// RNG
function rand(){
  seedValue+=0x6D2B79F5;
  let t=seedValue;
  t=Math.imul(t^t>>>15,t|1);
  t^=t+Math.imul(t^t>>>7,t|61);
  return ((t^t>>>14)>>>0)/4294967296;
}

// Deutsche Namen
async function getGermanName(id){
  let res = await fetch(`https://pokeapi.co/api/v2/pokemon-species/${id}`);
  let data = await res.json();
  let de = data.names.find(n=>n.language.name==="de");
  return de ? de.name : data.name;
}

// Back
function back(){
  document.getElementById("game").style.display="none";
  document.getElementById("menu").style.display="block";
}

// Start
async function startGame(){

  const player = document.getElementById("playerName").value.trim();
  const seedInput = document.getElementById("seedInput").value.trim();
  const lang = document.getElementById("lang").value;

  if(!player){
    alert(lang==="de"?"Bitte Name eingeben":"Enter name");
    return;
  }

  seedValue = hash(seedInput || "random");

  document.getElementById("menu").style.display="none";
  document.getElementById("game").style.display="block";

  let ids = [];
  for(let i=1;i<=151;i++) ids.push(i);

  ids.sort(()=>rand()-0.5);
  ids = ids.slice(0, 24);

  const board = document.getElementById("board");
  board.innerHTML = "Loading...";

  let data = [];

  for(let id of ids){
    let res = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
    let p = await res.json();

    let displayName = lang==="de"
      ? await getGermanName(id)
      : p.name;

    data.push({...p, displayName});
  }

  board.innerHTML = "";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.sprites.front_default}">
      <div>${p.displayName}</div>
    `;

    card.onclick=()=>card.classList.toggle("off");

    board.appendChild(card);
  });

  // Multiplayer Ziel
  let playerSeed = hash(seedInput + player);
  let targetIndex = Math.abs(playerSeed) % data.length;
  let target = data[targetIndex];

  document.getElementById("target").innerHTML =
    (lang==="de"?"Du bist: ":"You are: ")
    + "<b>"+target.displayName+"</b>";
}
</script>

</body>
</html>
