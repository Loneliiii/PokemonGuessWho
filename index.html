<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon - Wer bin ich?</title>
    
    <script src="Pokemon_data.js"></script>
    
    <style>
        :root {
            --poke-blue: #3b4cca;
            --poke-yellow: #ffcb05;
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #333333;
            --input-border: #cccccc;
            --target-bg: #d4edda;
            --target-border: #28a745;
            --shadow: rgba(0,0,0,0.1);
        }

        body.dark-mode {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --text-color: #f0f0f0;
            --input-border: #444444;
            --target-bg: #1b3320;
            --target-border: #2ecc71;
            --shadow: rgba(0,0,0,0.5);
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.3s, color 0.3s;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
            max-width: 1000px;
            margin-bottom: 20px;
        }

        h1 {
            color: var(--poke-yellow);
            -webkit-text-stroke: 1.5px var(--poke-blue);
            font-size: 2.5rem;
            margin: 0;
            text-shadow: 2px 2px 0px var(--poke-blue);
        }

        .dark-mode-toggle {
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 20px;
            border: 2px solid var(--poke-blue);
            background: var(--card-bg);
            color: var(--text-color);
            font-weight: bold;
        }

        .setup-container {
            background: var(--card-bg);
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 8px 20px var(--shadow);
            margin-bottom: 30px;
            width: 100%;
            max-width: 800px;
            text-align: center;
        }

        .gen-selector {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin: 15px 0 25px 0;
        }

        .gen-btn {
            padding: 10px 15px;
            border: 2px solid var(--poke-blue);
            background: transparent;
            color: var(--text-color);
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .gen-btn.active {
            background: var(--poke-blue);
            color: white;
        }

        .controls-row {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        input {
            padding: 12px;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            background: var(--card-bg);
            color: var(--text-color);
            width: 200px;
            font-size: 1rem;
        }

        .start-btn {
            background: #28a745;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            font-size: 1rem;
        }

        #target-pokemon {
            display: none;
            background: var(--target-bg);
            border: 3px solid var(--target-border);
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 30px;
            text-align: center;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 4px 15px var(--shadow);
        }

        #target-pokemon img { width: 120px; height: 120px; image-rendering: pixelated; }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
            gap: 15px;
            width: 100%;
            max-width: 1100px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 10px var(--shadow);
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s, filter 0.3s;
            border: 2px solid transparent;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Hover-Effekt nur für Karten, die NICHT ausgegraut sind */
        .card:not(.is-out):hover { 
            transform: translateY(-5px); 
            border-color: var(--poke-yellow); 
        }

        .card img { width: 90px; height: 90px; object-fit: contain; image-rendering: pixelated; }

        .card .name { font-weight: bold; margin: 10px 0 5px 0; font-size: 1.1rem; }

        .badge-container {
            display: flex;
            gap: 4px;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 8px;
        }

        .badge {
            font-size: 0.7rem;
            padding: 4px 6px;
            border-radius: 4px;
            color: white;
            font-weight: bold;
            text-transform: uppercase;
        }

        .gen-label { 
            font-size: 0.8rem; 
            opacity: 0.8; 
            margin-bottom: 3px; 
            margin-top: auto; 
            font-weight: bold;
        }

        /* Ausgrauen beim Klicken - Ohne Klick-Blockade! */
        .card.is-out {
            filter: grayscale(100%);
            opacity: 0.3;
            transform: scale(0.95);
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Pokémon Wer bin ich?</h1>
        <button class="dark-mode-toggle" onclick="toggleDarkMode()">🌓 Dark Mode</button>
    </div>

    <div class="setup-container">
        <div style="font-weight: bold; margin-bottom: 10px;">Generationen auswählen:</div>
        <div class="gen-selector" id="gen-selector"></div>
        
        <div class="controls-row">
            <input type="text" id="lobby-id" placeholder="Gemeinsame Spiel-ID">
            <button class="start-btn" onclick="initGame()">Feld generieren</button>
        </div>
    </div>

    <div id="target-pokemon">
        <div style="font-weight: bold; margin-bottom: 5px; color: var(--target-border)">DEIN ZIEL:</div>
        <img id="target-img" src="" alt="">
        <div id="target-name" style="font-size: 1.5rem; font-weight: bold;"></div>
        <div id="target-details" style="font-size: 1rem; margin-top: 10px; line-height: 1.5;"></div>
    </div>

    <div id="game-board" class="grid"></div>

    <script>
        const TYPE_COLORS = {
            fire: { name: 'Feuer', color: '#EE8130' }, grass: { name: 'Pflanze', color: '#7AC74C' },
            water: { name: 'Wasser', color: '#6390F0' }, bug: { name: 'Käfer', color: '#A6B91A' }, 
            normal: { name: 'Normal', color: '#A8A77A' }, poison: { name: 'Gift', color: '#A33EA1' },
            electric: { name: 'Elektro', color: '#F7D02C' }, ground: { name: 'Boden', color: '#E2BF65' }, 
            fairy: { name: 'Fee', color: '#D685AD' }, fighting: { name: 'Kampf', color: '#C22E28' },
            psychic: { name: 'Psycho', color: '#F95587' }, rock: { name: 'Gestein', color: '#B6A136' }, 
            ghost: { name: 'Geist', color: '#735797' }, ice: { name: 'Eis', color: '#96D9D6' },
            dragon: { name: 'Drache', color: '#6F35FC' }, dark: { name: 'Unlicht', color: '#705746' }, 
            steel: { name: 'Stahl', color: '#B7B7CE' }, flying: { name: 'Flug', color: '#A98FF3' }
        };

        let selectedGens = new Set([1]); 

        const genSelector = document.getElementById('gen-selector');
        for (let i = 1; i <= 9; i++) {
            const btn = document.createElement('button');
            btn.className = `gen-btn ${selectedGens.has(i) ? 'active' : ''}`;
            btn.innerText = `Gen ${i}`;
            btn.onclick = () => {
                if (selectedGens.has(i)) {
                    if (selectedGens.size > 1) selectedGens.delete(i);
                } else {
                    selectedGens.add(i);
                }
                updateGenButtons();
            };
            genSelector.appendChild(btn);
        }

        function updateGenButtons() {
            document.querySelectorAll('.gen-btn').forEach((btn, idx) => {
                btn.className = `gen-btn ${selectedGens.has(idx + 1) ? 'active' : ''}`;
            });
        }

        function toggleDarkMode() { document.body.classList.toggle('dark-mode'); }

        function seededRandom(seed) {
            const x = Math.sin(seed++) * 10000;
            return x - Math.floor(x);
        }

        function initGame() {
            const lobbyId = document.getElementById('lobby-id').value.trim();
            if (!lobbyId) return alert("Bitte Spiel-ID eingeben!");

            if (typeof POKEMON === 'undefined') {
                return alert("Fehler: Pokemon_data.js nicht geladen.");
            }

            const filteredPool = POKEMON.filter(p => selectedGens.has(p.gen));
            
            if (filteredPool.length < 24) {
                return alert("Zu wenige Pokémon in dieser Auswahl (min. 24 benötigt)!");
            }

            const board = document.getElementById('game-board');
            board.innerHTML = "";

            let seedValue = 0;
            for (let i = 0; i < lobbyId.length; i++) seedValue += lobbyId.charCodeAt(i);

            let poolCopy = [...filteredPool];
            let selection = [];
            for (let i = 0; i < 24; i++) {
                const r = seededRandom(seedValue + i);
                const index = Math.floor(r * poolCopy.length);
                selection.push(poolCopy[index]);
                poolCopy.splice(index, 1);
            }

            const myTarget = selection[Math.floor(Math.random() * selection.length)];
            
            const targetDiv = document.getElementById('target-pokemon');
            targetDiv.style.display = 'block';
            document.getElementById('target-img').src = myTarget.img;
            document.getElementById('target-name').innerText = myTarget.name_de;
            
            const targetTypes = myTarget.types.map(t => TYPE_COLORS[t]?.name || t).join(', ');
            document.getElementById('target-details').innerHTML = 
                `<strong>Typ:</strong> ${targetTypes} <br> 
                 <strong>Gen:</strong> ${myTarget.gen}`;

            selection.forEach(poke => {
                const card = document.createElement('div');
                card.className = 'card';
                
                const badgesHtml = poke.types.map(t => {
                    const tInfo = TYPE_COLORS[t] || { name: t, color: '#777' };
                    return `<span class="badge" style="background:${tInfo.color}">${tInfo.name}</span>`;
                }).join('');

                card.innerHTML = `
                    <img src="${poke.img}" alt="${poke.name_de}">
                    <div class="name">${poke.name_de}</div>
                    <div class="badge-container">${badgesHtml}</div>
                    <div class="gen-label">Gen ${poke.gen}</div>
                `;
                
                card.onclick = () => {
                    // Der Timeout verhindert, dass sich Klicks überschneiden
                    setTimeout(() => card.classList.toggle('is-out'), 50);
                };
                
                board.appendChild(card);
            });

            window.scrollTo({ top: targetDiv.offsetTop - 20, behavior: 'smooth' });
        }
    </script>
</body>
</html>
