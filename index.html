<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wer bin ich?</title>

<link rel="stylesheet" href="style.css">

<script src="pokemon_data.js"></script>
<script src="evolution.js"></script>
</head>

<body>

<div class="container">

<!-- MENU -->
<div id="menu" class="panel">
  <div class="title">Wer bin ich?</div>

  <div class="desc">
    Tippen = ausblenden<br>
    Doppeltippen = Infos
  </div>

  <input id="seedInput" placeholder="Seed"><br>
  <input id="playerInput" placeholder="Name"><br>

  <div class="section-title">Generationen</div>
  <div class="genbox">
    <label><input type="checkbox" value="1" checked><span>Gen 1</span></label>
    <label><input type="checkbox" value="2" checked><span>Gen 2</span></label>
    <label><input type="checkbox" value="3" checked><span>Gen 3</span></label>
    <label><input type="checkbox" value="4" checked><span>Gen 4</span></label>
    <label><input type="checkbox" value="5" checked><span>Gen 5</span></label>
    <label><input type="checkbox" value="6" checked><span>Gen 6</span></label>
    <label><input type="checkbox" value="7" checked><span>Gen 7</span></label>
    <label><input type="checkbox" value="8" checked><span>Gen 8</span></label>
    <label><input type="checkbox" value="9" checked><span>Gen 9</span></label>
  </div>

  <div class="section-title">Feldgröße</div>
  <div class="genbox">
    <label><input type="radio" name="size" value="12"><span>12</span></label>
    <label><input type="radio" name="size" value="24" checked><span>24</span></label>
    <label><input type="radio" name="size" value="36"><span>36</span></label>
    <label><input type="radio" name="size" value="48"><span>48</span></label>
  </div>

  <button onclick="startGame()">Start</button>
</div>

<!-- GAME -->
<div id="game" class="panel" style="display:none;">

  <div class="panel-top">
    <button onclick="back()">⬅ Neue Runde</button>

    <div class="zoom-group">
      <button onclick="zoomIn()">+</button>
      <button onclick="zoomOut()">-</button>
    </div>
  </div>

  <div id="activeRule" class="active-rule"></div>
  <div id="target"></div>
  <div id="board" class="grid"></div>

</div>

</div>

<!-- INTRO -->
<div id="intro">
  <span id="introText"></span>
</div>

<!-- RULES -->
<div id="rulesScreen">
  <div class="rules-box">
    <h2>⚠️ Sonderregel</h2>
    <div id="rulesList"></div>
  </div>
</div>

<!-- POPUP -->
<div id="popup" onclick="closePopup()">
  <div class="popup-box" onclick="event.stopPropagation()">
    <img id="popImg">
    <h3 id="popName"></h3>
    <div id="popDex"></div>
    <div id="popTypes"></div>
    <div id="popEvo"></div>
    <button onclick="closePopup()">Schließen</button>
  </div>
</div>

<script>

/* RNG */
let seedValue=0;
function hash(str){ let h=0; for(let i=0;i<str.length;i++){ h=Math.imul(31,h)+str.charCodeAt(i)|0;} return h;}
function rand(){ seedValue+=0x6D2B79F5; let t=seedValue; t=Math.imul(t^t>>>15,t|1); t^=t+Math.imul(t^t>>>7,t|61); return ((t^t>>>14)>>>0)/4294967296;}

/* ZOOM */
let tileSize=90;
function applyZoom(){ document.documentElement.style.setProperty("--tile-size", tileSize+"px"); }
function zoomIn(){ tileSize+=20; applyZoom(); }
function zoomOut(){ tileSize-=20; applyZoom(); }

/* RULES */
const RULES=[
  "Keine Fragen zu Typen",
  "Keine Fragen zu Entwicklungen",
  "Keine Fragen zur Farbe"
];

function getRule(){ return RULES[Math.floor(rand()*RULES.length)]; }

/* INTRO (ROULETTE) */
async function playIntro(target, pool){

  intro.classList.add("show");

  for(let i=0;i<30;i++){
    let p=pool[Math.floor(Math.random()*pool.length)];
    introText.innerText=p.name_de;
    await new Promise(r=>setTimeout(r,50));
  }

  for(let i=0;i<10;i++){
    introText.innerText = Math.random()<0.5 ? target.name_de : pool[Math.floor(Math.random()*pool.length)].name_de;
    await new Promise(r=>setTimeout(r,80+i*20));
  }

  introText.innerText=target.name_de;

  await new Promise(r=>setTimeout(r,500));

  intro.classList.remove("show");
}

/* POPUP */
function showPopup(p){
  popup.style.display="flex";
  popImg.src=p.img;
  popName.innerText=p.name_de;
  popDex.innerText="Dex #"+p.id;
  popTypes.innerText=(p.types||[]).join(", ");
  popEvo.innerText=getEvolutionChain(p).map(e=>e.name_de).join(" → ");
}
function closePopup(){ popup.style.display="none"; }

/* GAME START */
async function startGame(){

  if(typeof applyEvolutionData==="function"){
    applyEvolutionData();
  }

  applyZoom();

  let seed=seedInput.value;
  let player=playerInput.value||"player";

  seedValue=hash(seed||"random");

  let gens=Array.from(document.querySelectorAll(".genbox input:checked")).map(e=>parseInt(e.value));
  let size=parseInt(document.querySelector('input[name="size"]:checked').value);

  let pool=POKEMON.filter(p=>gens.includes(p.gen));

  for(let i=pool.length-1;i>0;i--){
    let j=Math.floor(rand()*(i+1));
    [pool[i],pool[j]]=[pool[j],pool[i]];
  }

  let data=pool.slice(0,size);
  let target=data[Math.abs(hash(seed+player))%data.length];

  menu.style.display="none";

  await playIntro(target,pool);

  let rule=getRule();
  rulesList.innerText="❌ "+rule;

  rulesScreen.classList.add("show");
  await new Promise(r=>setTimeout(r,2000));
  rulesScreen.classList.remove("show");

  game.style.display="block";
  activeRule.innerText="⚠️ "+rule;

  board.innerHTML="";

  data.forEach(p=>{
    let card=document.createElement("div");
    card.className="card";

    card.innerHTML=`
      <img src="${p.img}">
      <div>${p.name_de}</div>
      <div class="types">
        ${(p.types||[]).map(t=>`<span class="type ${t}">${t}</span>`).join("")}
      </div>
    `;

    let lastTap=0;

    card.onclick=()=>{
      let now=Date.now();

      if(now-lastTap<300){
        showPopup(p);
      } else {
        setTimeout(()=>{
          if(Date.now()-lastTap>=300){
            card.classList.toggle("off");
          }
        },300);
      }

      lastTap=now;
    };

    board.appendChild(card);
  });

  target.innerText="Du bist: "+target.name_de;
}

function back(){
  game.style.display="none";
  menu.style.display="block";
}

</script>

</body>
</html>
